name: Build & Test

on: [push, pull_request]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libfreetype6-dev \
            libwebkit2gtk-4.0-dev

      - name: Configure CMake
        run: cmake --preset release

      - name: Build
        run: cmake --build build/release --config Release

      - name: Test
        run: ctest --test-dir build/release --output-on-failure -V

      - name: Upload VST3 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vst3-${{ matrix.os }}
          path: build/release/**/*.vst3
